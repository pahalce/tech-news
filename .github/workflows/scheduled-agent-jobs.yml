name: Scheduled Agent Jobs

on:
  schedule:
    # collect-feedback: 08:00 JST daily
    - cron: "0 23 * * *"
    # zenn-digest: starts at 05:00 JST daily so delayed GitHub schedules land near 09:00 JST
    - cron: "0 20 * * *"
    # suggest-feature-vocabulary: 08:30 JST Saturdays
    - cron: "30 23 * * 5"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "zenn-digest"
        type: choice
        options:
          - zenn-digest
          - collect-feedback
          - suggest-feature-vocabulary
          - all

permissions:
  contents: write

jobs:
  collect-feedback:
    if: github.event.schedule == '0 23 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'collect-feedback' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect-feedback
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi

  zenn-digest:
    if: github.event.schedule == '0 20 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'zenn-digest' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zenn-digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi

  suggest-feature-vocabulary:
    if: github.event.schedule == '30 23 * * 5' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'suggest-feature-vocabulary' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm suggest-feature-vocabulary
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi
