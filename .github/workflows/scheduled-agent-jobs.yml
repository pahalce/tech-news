name: Scheduled Agent Jobs

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 23 * * 5"
  workflow_dispatch:

jobs:
  collect-feedback:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect-feedback
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEATURE_EXTRACTION_MODEL: ${{ vars.FEATURE_EXTRACTION_MODEL }}
          PREFERENCE_SUMMARY_MODEL: ${{ vars.PREFERENCE_SUMMARY_MODEL }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi

  zenn-digest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zenn-digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEATURE_EXTRACTION_MODEL: ${{ vars.FEATURE_EXTRACTION_MODEL }}
          RECOMMENDATION_CONTENT_MODEL: ${{ vars.RECOMMENDATION_CONTENT_MODEL }}
          RERANK_MODEL: ${{ vars.RERANK_MODEL }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi

  suggest-feature-vocabulary:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 23 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm suggest-feature-vocabulary
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOCABULARY_SUGGESTION_MODEL: ${{ vars.VOCABULARY_SUGGESTION_MODEL }}
      - name: Data Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist agent state [skip ci]"
            git push
          fi
